<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Havaskorlar futbol ligasi</title>
<meta name="description" content="Havaskorlar futbol ligasi: jadval, o‘yinlar, to‘purarlar va jamoalar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>:root{
  --bg:#e8eaee; --bg-2:#dde0e6; --surface:#ffffff; --surface-2:#f2f4f7;
  --ink:#12161d; --ink-2:#464f5e; --ink-3:#657083; --rule:#cdd2da;
  --blue:#2450d6; --on-blue:#ffffff; --blue-soft:#e3eaff;
  --yellow:#f5c518; --on-yellow:#1c1500; --red:#d4283f; --green:#138a4b;
  --header-bg:#12161d; --on-header:#f2f4f7; --on-header-2:#a9b2c1;
  --board:#171c24; --on-board:#f2f4f7; --on-board-2:#aab3c2; --board-line:rgba(255,255,255,.13);
  --ok-soft:#dff3e7; --bad-soft:#fbe3e7; --warn-soft:#fff3c4;
  --f-display:'Oswald','Arial Narrow','Helvetica Neue Condensed',Impact,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1217; --bg-2:#151a21; --surface:#1a202a; --surface-2:#232b37;
    --ink:#eef1f5; --ink-2:#b3bccb; --ink-3:#8c96a7; --rule:#2f3947;
    --blue:#7d9bff; --on-blue:#0a1020; --blue-soft:#1b2646;
    --header-bg:#090c10; --board:#0b0e13;
    --ok-soft:#12331f; --bad-soft:#3a1820; --warn-soft:#3a3010;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1217; --bg-2:#151a21; --surface:#1a202a; --surface-2:#232b37;
  --ink:#eef1f5; --ink-2:#b3bccb; --ink-3:#8c96a7; --rule:#2f3947;
  --blue:#7d9bff; --on-blue:#0a1020; --blue-soft:#1b2646;
  --header-bg:#090c10; --board:#0b0e13;
  --ok-soft:#12331f; --bad-soft:#3a1820; --warn-soft:#3a3010;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--header-bg);z-index:60}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.005em;line-height:1.12;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--header-bg);color:var(--on-header)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--yellow)}
.bname{font:600 19px/1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.seg{display:inline-flex;border:1px solid #ffffff33;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--on-header-2);padding:5px 9px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow);font-weight:600}
.ibtn{background:transparent;border:1px solid #ffffff33;border-radius:8px;color:var(--on-header);width:34px;height:30px;cursor:pointer;display:grid;place-items:center}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:9px 12px 10px;color:var(--on-header-2);font-weight:500;font-size:14.5px;border-bottom:3px solid transparent}
.nav a:hover{color:var(--on-header)}
.nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--yellow)}
.nav a.adm{margin-left:auto;color:var(--yellow)}

main{padding:20px 0 90px;min-height:70vh}
.page-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.page-h h1{font-size:30px}
.sub{color:var(--ink-3);font-size:14px}
.sec{margin:28px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:22px}
.more{font-size:14px;color:var(--blue);font-weight:600}
.more:hover{text-decoration:underline}

/* hero scoreboard */
.hero{background:var(--board);color:var(--on-board);border-radius:14px;padding:22px 20px 18px;position:relative;overflow:hidden;
  background-image:
   radial-gradient(circle at 88% 50%,transparent 0 70px,var(--board-line) 70px 72px,transparent 72px),
   linear-gradient(90deg,transparent calc(88% - 1px),var(--board-line) calc(88% - 1px) calc(88% + 1px),transparent calc(88% + 1px)),
   linear-gradient(180deg,transparent calc(100% - 1px),var(--board-line) calc(100% - 1px))}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:700;max-width:22ch}
.hero .meta{color:var(--on-board-2);margin:6px 0 14px;font-size:14.5px}
.rounds{display:flex;gap:3px;margin:0 0 18px;max-width:560px}
.rounds a{flex:1;height:8px;border-radius:2px;background:#ffffff26;position:relative}
.rounds a.done{background:var(--yellow)}
.rounds a.part{background:linear-gradient(90deg,var(--yellow) 50%,#ffffff26 50%)}
.rounds a:hover{outline:2px solid #fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tile{display:block;background:#ffffff12;border:1px solid #ffffff1f;border-radius:10px;padding:9px 12px}
.tile:hover{background:#ffffff1c}
.tile .ln{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0}
.tile .ln .tn{display:flex;align-items:center;gap:8px;min-width:0;color:var(--on-board-2)}
.tile .ln .tn bdi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ln b{font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--on-board-2)}
.tile .ln.w .tn{color:#fff;font-weight:600}
.tile .ln.w b{color:var(--yellow)}
.tile .foot{font-size:12px;color:var(--on-board-2);margin-top:4px;border-top:1px solid #ffffff1a;padding-top:4px}

/* crest */
.crest{--c:#2450d6;flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:600 9.5px/1 var(--f-display);letter-spacing:.02em;box-shadow:inset 0 0 0 2px #ffffff55;overflow:hidden}
.crest.lg{width:64px;height:64px;font-size:20px;box-shadow:inset 0 0 0 4px #ffffff55}
.crest.sm{width:20px;height:20px;font-size:8px}

/* panels & tables */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:880px){.grid2{grid-template-columns:1.25fr 1fr}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;font-size:12.5px;color:var(--ink-3);text-align:right;padding:9px 8px;background:var(--surface-2);border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th.l,.tbl td.l{text-align:left}
.tbl .c-rank{width:38px;min-width:38px;text-align:center;position:sticky;left:0;background:var(--surface);z-index:1}
.tbl th.c-rank{background:var(--surface-2)}
.tbl .c-team{position:sticky;left:38px;background:var(--surface);text-align:left;min-width:150px;z-index:1}
.tbl th.c-team{background:var(--surface-2)}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.lead td.c-rank{box-shadow:inset 4px 0 0 var(--yellow);font-weight:700}
.tbl td.pts{font-weight:700;font-size:15.5px}
.tbl .pen{color:var(--red);font-size:12px;margin-left:3px;font-weight:600}
.tl{display:inline-flex;align-items:center;gap:9px;min-width:0}
.tl:hover .tn{text-decoration:underline}
.tn{font-weight:500}
.form{display:inline-flex;gap:3px}
.form i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font:normal 600 11px/1 var(--f-body);color:#fff}
.form .w{background:var(--green)}.form .d{background:#7a8496}.form .l{background:var(--red)}
.foot-note{font-size:13px;color:var(--ink-3);padding:10px 12px;border-top:1px solid var(--rule)}
.foot-note p{margin:2px 0}

/* match rows */
.mlist{display:flex;flex-direction:column}
.mday{font-weight:600;font-size:13.5px;color:var(--ink-2);padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--rule);border-top:1px solid var(--rule)}
.mday:first-child{border-top:0}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px 10px;padding:11px 14px;border-bottom:1px solid var(--rule)}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--surface-2)}
.mrow .mh,.mrow .ma{display:flex;align-items:center;gap:9px;min-width:0}
.mrow .mh{justify-content:flex-end;text-align:right}
.mrow .mh bdi,.mrow .ma bdi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .win bdi{font-weight:700}
.mrow .lose{color:var(--ink-2)}
.sc{font:600 22px/1 var(--f-display);min-width:74px;text-align:center;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;white-space:nowrap}
.sc i{font-style:normal;color:var(--ink-3);margin:0 4px}
.sc.pend{font-size:15px;font-weight:500;color:var(--ink-2)}
.mmeta{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--ink)}
.badge.red{background:var(--bad-soft)}
.badge.ok{background:var(--ok-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px;cursor:pointer;font-weight:500}
.chip[aria-current="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.done::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle}

/* team + player */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tcard{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.tcard:hover{border-color:var(--ink-3)}
.tcard b{display:block;font-weight:600}
.tcard small{color:var(--ink-3)}
.thead{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.thead h1{font-size:34px}
.stats{display:flex;flex-wrap:wrap;gap:0;margin:0 0 20px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);overflow:hidden}
.stats div{flex:1 1 84px;padding:10px 12px;border-right:1px solid var(--rule);min-width:84px}
.stats div:last-child{border-right:0}
.stats b{display:block;font:600 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink-3)}
.ico{display:inline-block;vertical-align:-2px}
.cardicon{display:inline-block;width:11px;height:15px;border-radius:2px;vertical-align:-2px}
.cardicon.y{background:var(--yellow)}.cardicon.r{background:var(--red)}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ev>div{padding:12px 14px}
.ev>div+div{border-left:1px solid var(--rule)}
.ev h3{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ev ul{list-style:none;margin:0;padding:0}
.ev li{padding:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mhead{background:var(--board);color:var(--on-board);border-radius:14px;padding:18px 16px;margin-bottom:16px;
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),var(--board-line) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}
.mhead .row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.mhead .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:600;font-size:16px}
.mhead .big{font:700 clamp(38px,9vw,64px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mhead .info{margin-top:12px;text-align:center;color:var(--on-board-2);font-size:13.5px}
.mhead .info span{margin:0 6px}
.empty{padding:26px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-size:17px;margin-bottom:4px;color:var(--ink)}
.rules{margin:0;padding:0;list-style:none}
.rules li{padding:11px 14px;border-bottom:1px solid var(--rule);display:flex;gap:12px;justify-content:space-between}
.rules li:last-child{border-bottom:0}
.rules li span:first-child{color:var(--ink-2)}
.rules li b{text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:9px 14px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.sel{padding:7px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--surface)}

/* admin */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14.5px;cursor:pointer;min-height:38px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.sec2{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar .grow{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-weight:600;font-size:13.5px}
.fld .hint{font-size:12.5px;color:var(--ink-3)}
.fld input,.fld select,.fld textarea{padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);min-height:40px;width:100%}
.fld textarea{min-height:110px;resize:vertical}
.fld input[type=color]{padding:2px;height:40px;width:70px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule)}
.steps li:last-child{border-bottom:0}
.steps .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-size:12px;color:#fff}
.steps li.ok .dot{background:var(--green);border-color:var(--green)}
.steps .t{flex:1}
.steps .t small{display:block;color:var(--ink-3)}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:flex-start}
.checks li:last-child{border-bottom:0}
.checks .lv{flex:none;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-top:8px}
.checks .lv.bad{background:var(--red)}
.checks .lv.ok{background:var(--green)}
.note{background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 14px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule)}
.qrow:last-child{border-bottom:0}
.qrow .pn{display:flex;gap:8px;align-items:baseline;min-width:0}
.qrow .pn bdi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.qrow .pn small{color:var(--ink-3)}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.qb{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;min-height:36px;padding:2px 4px 2px 8px;font-size:13px}
.qb button{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:6px;font-weight:700;font-size:16px;cursor:pointer;line-height:1}
.qb b{min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.qb button:disabled{opacity:.35}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.savebar span{font-weight:500}
.savebar .btn{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.savebar .btn.ghost{background:transparent;color:var(--bg);border-color:var(--bg)}
dialog{border:1px solid var(--rule);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:#0009}
dialog .dh{padding:16px 18px 6px}
dialog .dh h2{font-size:22px}
dialog .db{padding:8px 18px 4px;overflow:auto;max-height:calc(100vh - 220px)}
dialog .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;flex-wrap:wrap}
.err{color:var(--red);font-size:13.5px;margin:0 18px 6px;min-height:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:70;font-weight:500;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:560px){
  .mrow{grid-template-columns:1fr auto 1fr;padding:10px 10px}
  .sc{min-width:62px;font-size:19px}
  .ev{grid-template-columns:1fr}
  .ev>div+div{border-left:0;border-top:1px solid var(--rule)}
  .hero{padding:18px 14px 14px;background-image:linear-gradient(180deg,transparent calc(100% - 1px),var(--board-line) calc(100% - 1px))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tile{padding:8px 9px}
  .tile .ln b{font-size:22px}
  .tile .ln .tn{gap:6px;font-size:13.5px}
  .bname{font-size:17px}
}
@media(prefers-reduced-motion:no-preference){
  .hero .tiles .tile{animation:tin .5s ease both}
  .hero .tiles .tile:nth-child(2){animation-delay:.06s}.hero .tiles .tile:nth-child(3){animation-delay:.12s}.hero .tiles .tile:nth-child(4){animation-delay:.18s}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media print{.top,.savebar,.tools{display:none}body::before{display:none}}
/* media, footer, reglament, poster */
.soc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.socb{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:12px;background:var(--board);color:var(--on-board);border-left:6px solid var(--yellow)}
.socb b{font:600 22px/1.1 var(--f-display)}.socb span{color:var(--on-board-2);font-size:14px}
.socb.telegram{border-left-color:#35a8e0}.socb.instagram{border-left-color:#d6409f}.socb.youtube{border-left-color:#e53935}
.foot{display:flex;gap:14px 24px;flex-wrap:wrap;justify-content:space-between;padding-top:18px;padding-bottom:30px;border-top:1px solid var(--rule);color:var(--ink-3);font-size:14px}
.fsoc{display:flex;gap:16px;flex-wrap:wrap}.fsoc a{font-weight:600;color:var(--ink-2)}.fsoc a:hover{text-decoration:underline}
.reg h3.rg{font-size:20px;margin:18px 0 6px}
.reg .rgl{margin:0 0 6px;padding-left:22px}.reg .rgl li{margin:5px 0;max-width:75ch}
.reg p{max-width:75ch}
.posterbox{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:22px;align-items:start}
.posterbox canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--rule);background:#0b1017}
@media(max-width:760px){.posterbox{grid-template-columns:1fr}}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}

/* logo, banner, mobile */
.crest.has-logo{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--rule)}
.crest img{width:100%;height:100%;object-fit:cover;display:block}
.logo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo-row input[type=file]{max-width:100%}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--rule)}
.upl{display:grid;grid-template-columns:1fr 1fr;gap:20px}.upl p{margin:2px 0 8px}
@media(max-width:700px){.upl{grid-template-columns:1fr}}
.banner{display:block;width:100%;height:auto;border-radius:14px;margin:0 0 16px;border:1px solid var(--rule)}
.sub-m{display:none;font-size:12.5px;color:var(--ink-3);line-height:1.2}
.menu{list-style:none;margin:0;padding:0}.menu a{display:block;padding:14px 4px;font-size:17px;font-weight:600;border-bottom:1px solid var(--rule)}
.bnav{display:none}
@media(max-width:760px){
  .top .nav{display:none}
  .bar{padding-bottom:10px}
  main{padding-top:14px;padding-bottom:110px}
  .page-h h1{font-size:26px}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:54;background:var(--header-bg);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid #ffffff22}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--on-header-2);font-size:11px;font-weight:500;padding:6px 0;min-height:48px;cursor:pointer;border-radius:8px}
  .bnav [aria-current="page"]{color:var(--yellow)}
  .savebar{bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .foot{padding-bottom:20px}
}
@media(max-width:560px){
  .hm{display:none}
  .sub-m{display:block}
  .tbl{font-size:14px}
  .tbl th,.tbl td{padding:10px 6px}
  .tbl .c-rank{width:34px;min-width:34px}
  .tbl .c-team{left:34px;min-width:0}
  .tbl td.pts{font-size:16px}
  .crest{width:28px;height:28px}
  .stats div{flex:1 1 70px;min-width:70px}
  .sec-h h2{font-size:20px}
  .thead h1{font-size:28px}
}

#app.dirty main{padding-bottom:230px}
@media(min-width:761px){#app.dirty main{padding-bottom:110px}}
.row-actions{flex-direction:row}
@media(max-width:480px){
  .bname{font-size:15.5px}
  .seg button{padding:5px 8px;font-size:12.5px}
  .tools .ibtn{display:none}
  .tbl .row-actions{flex-direction:column}
}

.linkbtn{background:none;border:0;padding:0;color:var(--ink-2);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.fauth{color:var(--ink-3)}
</style>

<script id="state" type="application/json">{"v":1,"meta":{"platform":"Havaskorlar futbol ligasi","name":"Chalaqo‘rg‘on Kattalar ligasi","season":"2026","venue":"","script":"lat","translit":true,"reglament":"## Hakamlik masalasi\n1. Bosh hakam qaror chiqarishda yon hakamlar va VAR tizimi (o‘rnatilgan bo‘lsa) bilan maslahatlashib qaror chiqarishi mumkin. Har qanday holatda ham o‘yindagi so‘nggi qarorni bosh hakamning o‘zi chiqaradi.\n2. Istisno: bosh hakam o‘ta qo‘pol xatolarga yo‘l qo‘ysa, o‘yindan keyin bosh hakamning qarori ustidan nazorat «Kengash» yig‘ilishida ko‘rib chiqiladi va shu masala yuzasidan tegishli qaror chiqariladi.\n## Kartochkalar masalasi\n1. Sariq kartochka: agar o‘yinchi kimningdir shaxsiyatiga zid so‘ksa, avvalo sariq kartochka beriladi; bu hol qayta takrorlansa, qizil kartochka beriladi.\n2. O‘yindagi birinchi kichik fol uchun bosh hakam sariq kartochka o‘rniga og‘zaki ogohlantirishi ham mumkin; bunda ham qaror hakamning o‘zida.\n3. Qizil kartochka: raqibga o‘ta agressiv o‘ynalsa; o‘ta qattiq haqorat bilan raqibni so‘kib, unga tashlansa.\n4. Hujumchi bilan birga-bir chiqib ketgan vaziyatda ortdan qilingan har qanday kontakt, ya’ni eng oxirgi himoyachi tomonidan so‘nggi umid foli qilingani hisoblanadi.\n5. Qizil kartochka olgan o‘yinchi navbatdagi 1 ta o‘yinni o‘tkazib yuboradi.\n## O‘yinchilar soni va o‘yinchi almashtirish masalasi\n1. Jamoalar futbol qoidasi bo‘yicha 11 kishidan, jami 22 kishi maydonda o‘ynaydi.\n2. Bir jamoada 11 kishi bo‘lib, ikkinchi jamoada kam bo‘lsa (masalan, 10, 9, 8 yoki 7 kishi), o‘yin baribir o‘tkaziladi.\n3. O‘yinchi almashtirish chegarasiz; bir o‘yinchi qayta-qayta almashtirilishi mumkin.\n## O‘yinlar vaqti masalasi\n1. O‘yinlar belgilangan vaqtda boshlanadi. O‘yin vaqti 25 daqiqadan 2 taym, jami 50 daqiqa.\n2. O‘yin uchun eng ko‘p qo‘shilgan vaqt 4–5 daqiqani tashkil qiladi.\n3. O‘yinlar turnir qoidasi bo‘yicha «davraviy» o‘tkaziladi: barcha jamoalar bir-biri bilan o‘ynab chiqadi.\n4. O‘yin asosiy vaqti durang bilan tugasa, hech qanday qo‘shimcha vaqt va penaltilar seriyasi belgilanmaydi.\n5. G‘olib aniqlanishi shart emas.\n6. Jamoalardan biri o‘yin vaqtidan 30 daqiqa kechikib kelsa, kechikkan yoki kelmagan jamoaga TEXNIK MAG‘LUBIYAT yoziladi. Agar o‘yindan oldin Kengashga aniq uzrli sabab bilan biror jamoa ariza topshirgan bo‘lsa, bu masala ko‘rib chiqiladi. Qolgan barcha vaziyatlarda jamoalar belgilangan o‘yin vaqtiga kelishi shart.\n## Media masalasi\n1. Ikki kishi biriktiriladi; video tizimi ham shularda bo‘ladi.\n2. O‘yindan keyin jamoa a’zolari bilan intervyu va tahlillarni shu ikki kishi olib boradi.\n## Jamoalar tarkibi masalasi\n1. Turnir qoidasi bo‘yicha faqat bitta sinfda o‘qigan sinfdosh yillar qatnashadi.\n2. Eng oxirgi yaxlit qatnashuvchi yil — yoshi 40 ga to‘lganlar, ya’ni 1986-yil deb belgilangan.\n3. Faqat VETERANLAR jamoasi 40 yoshdan (1986-yildan) yuqori yillar, ya’ni katta yoshlilar terma jamoasi bo‘lishi mumkin.\n## Mehmon va mezbon maqomi masalasi\n1. Jamoalar formasi rangi bir xil bo‘lsa, mezbon jamoa o‘z formasida, mehmon jamoa esa boshqa formada o‘ynaydi. Jamoalar buni o‘yinda kelishib olishi ham mumkin.\n## VAR tizimi masalasi\n1. VAR qizil kartochkani ko‘rib chiqadi.\n2. VAR burchak to‘pi masalasini ko‘rib chiqadi.\n3. VAR penaltili vaziyatni ko‘rib chiqadi.\n4. Umumiy bahsli vaziyatlar VAR tomonidan ko‘rib chiqilishi mumkin.\n## Kengash\n1. Turnirning 5 ta muhim a’zosi, ya’ni «Kengash» barcha holatlar ustidan o‘z qarorini chiqarish vakolatiga ega.\n2. Turnirning umumiy nazoratini «Kengash» olib boradi va barcha turnir ishtirokchilari bunga bo‘ysunadi.","telegram":"https://t.me/kattalarturnir2026","instagram":"","youtube":"","banner":"","posterBg":"da268f78923f66391e047a0057e1ff8c","siteUrl":"https://suyun-bek.github.io/havaskorlar-futbol-ligasi/","updated":"2026-11-19T12:39:21.962Z"},"rules":{"win":3,"draw":1,"loss":0,"tech":[3,0],"yellowBan":0,"redBan":1,"tiebreak":["gd","gf"]},"teams":[{"id":"t1","name":"1993","short":"93","color":"#8a861e","des <script>(function(){
"use strict";
/* ---------- Lotin → Kirill (faqat interfeys matni) ---------- */
const CYMAP={a:'а',b:'б',d:'д',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',c:'к',w:'в'};
const isLet=(c)=>/[A-Za-z\u2018\u2019\u02BB']/.test(c||'');
function toCyr(str){
  let out='';const n=str.length;
  for(let i=0;i<n;i++){
    const ch=str[i],lo=ch.toLowerCase(),up=ch!==lo,nx=(str[i+1]||'').toLowerCase(),nx2=str[i+2]||'';
    const C=(s)=>up?s.charAt(0).toUpperCase()+s.slice(1):s;
    const mod=(c)=>c==='\u2018'||c==='\u02BB'||c==="'";
    if((lo==='o'||lo==='g')&&mod(nx)){out+=C(lo==='o'?'ў':'ғ');i++;continue}
    if(lo==='s'&&nx==='h'){out+=C('ш');i++;continue}
    if(lo==='c'&&nx==='h'){out+=C('ч');i++;continue}
    if(lo==='t'&&nx==='s'){out+=C('ц');i++;continue}
    if(lo==='y'&&(nx==='a'||nx==='u'||nx==='e'||(nx==='o'&&!mod(nx2)))){out+=C(nx==='a'?'я':nx==='u'?'ю':nx==='e'?'е':'ё');i++;continue}
    if(lo==='e'){out+=C(isLet(str[i-1])?'е':'э');continue}
    if(ch==='\u2019'||ch==="'"){out+=(isLet(str[i-1])&&isLet(str[i+1]))?'ъ':ch;continue}
    if(CYMAP[lo]){out+=C(CYMAP[lo]);continue}
    out+=ch;
  }
  return out;
}
function cyrDom(root){
  const tl=!!(typeof S!=='undefined'&&S.meta&&S.meta.translit);
  const skip=(n)=>(n.tagName==='BDI'||n.hasAttribute('data-name'))?!tl:(n.hasAttribute('data-raw')||/^(SCRIPT|STYLE|TEXTAREA|INPUT|SVG)$/i.test(n.tagName));
  const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(n.nodeType===1)return skip(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP;
    return NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(t=>{t.nodeValue=toCyr(t.nodeValue)});
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>{
    if(!tl&&e.closest('bdi,[data-name]'))return;if(e.closest('[data-raw]'))return;
    ['placeholder','title','aria-label'].forEach(a=>{if(e.hasAttribute(a))e.setAttribute(a,toCyr(e.getAttribute(a)))});
  });
}

/* ---------- Holat va yordamchilar ---------- */
const $q=(s,r)=>(r||document).querySelector(s);
const $qa=(s,r)=>[...(r||document).querySelectorAll(s)];
let S=JSON.parse(document.getElementById('state').textContent);
let IDX={t:new Map(),p:new Map(),m:new Map()};
function reindex(){IDX.t=new Map(S.teams.map(t=>[t.id,t]));IDX.p=new Map(S.players.map(p=>[p.id,p]));IDX.m=new Map(S.matches.map(m=>[m.id,m]))}
reindex();
const team=(id)=>IDX.t.get(id);
const nid=(k)=>{S.seq[k]=(S.seq[k]||0)+1;return k+S.seq[k]};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=(s)=>'<bdi>'+esc(s)+'</bdi>';
const MONTHS=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
const WDAYS=['yakshanba','dushanba','seshanba','chorshanba','payshanba','juma','shanba'];
const pad2=(n)=>String(n).padStart(2,'0');
function parseISO(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null}
function fmtD(s,wd,yr){const d=parseISO(s);if(!d)return 'Sana belgilanmagan';return (wd?WDAYS[d.getUTCDay()]+', ':'')+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+(yr?' '+d.getUTCFullYear():'')}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function addDays(iso,n){const d=parseISO(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function addMin(hhmm,n){const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||'');if(!m)return '';const t=(+m[1]*60+ +m[2]+n)%1440;return pad2(Math.floor(t/60))+':'+pad2(t%60)}
const counted=(m)=>m.status==='played'||m.status==='tech';
const chrono=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'').localeCompare(b.time||'')||a.round-b.round;

/* ---------- Hisob-kitob ---------- */
function mScore(m){
  const R=S.rules;
  if(m.status==='tech')return m.techWinner==='home'?[R.tech[0],R.tech[1]]:[R.tech[1],R.tech[0]];
  if(m.status!=='played')return null;
  if(m.manual)return [Math.max(0,+m.hg||0),Math.max(0,+m.ag||0)];
  let h=0,a=0;
  for(const e of m.ev||[]){
    if(e.t!=='g'&&e.t!=='og')continue;
    const p=IDX.p.get(e.p);if(!p)continue;
    const side=p.tid===m.home?'h':p.tid===m.away?'a':null;if(!side)continue;
    if((e.t==='g')===(side==='h'))h++;else a++;
  }
  return [h,a];
}
function standings(){
  const R=S.rules;
  const rows=new Map(S.teams.map(t=>[t.id,{t,id:t.id,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pen:0,pts:0,form:[]}]));
  const done=S.matches.filter(counted).sort(chrono);
  for(const m of done){
    const sc=mScore(m),H=rows.get(m.home),A=rows.get(m.away);if(!H||!A)continue;
    H.p++;A.p++;H.gf+=sc[0];H.ga+=sc[1];A.gf+=sc[1];A.ga+=sc[0];
    if(sc[0]>sc[1]){H.w++;A.l++;H.pts+=R.win;A.pts+=R.loss;H.form.push('w');A.form.push('l')}
    else if(sc[0]<sc[1]){A.w++;H.l++;A.pts+=R.win;H.pts+=R.loss;A.form.push('w');H.form.push('l')}
    else{H.d++;A.d++;H.pts+=R.draw;A.pts+=R.draw;H.form.push('d');A.form.push('d')}
  }
  for(const j of S.penalties){const r=rows.get(j.tid);if(r){const v=+j.pts||0;r.pen+=v;r.pts-=v}}
  const arr=[...rows.values()];arr.forEach(r=>{r.gd=r.gf-r.ga});
  arr.sort((a,b)=>b.pts-a.pts);
  const out=[];let i=0;
  while(i<arr.length){let j=i;while(j<arr.length&&arr[j].pts===arr[i].pts)j++;
    const g=arr.slice(i,j);out.push(...(g.length>1?breakTies(g,done):g));i=j}
  out.forEach((r,k)=>{r.rank=k+1});
  return out;
}
function breakTies(grp,done){
  const R=S.rules,ids=new Set(grp.map(r=>r.id)),mini=new Map(grp.map(r=>[r.id,{pts:0,gf:0,ga:0}]));
  for(const m of done){
    if(!ids.has(m.home)||!ids.has(m.away))continue;
    const sc=mScore(m),h=mini.get(m.home),a=mini.get(m.away);
    h.gf+=sc[0];h.ga+=sc[1];a.gf+=sc[1];a.ga+=sc[0];
    if(sc[0]>sc[1])h.pts+=R.win;else if(sc[0]<sc[1])a.pts+=R.win;else{h.pts+=R.draw;a.pts+=R.draw}
  }
  const val=(r,c)=>{const x=mini.get(r.id);return c==='h2hPoints'?x.pts:c==='h2hGD'?x.gf-x.ga:c==='h2hGF'?x.gf:c==='gd'?r.gd:c==='gf'?r.gf:0};
  return grp.slice().sort((a,b)=>{for(const c of R.tiebreak){const d=val(b,c)-val(a,c);if(d)return d}return b.gd-a.gd||b.gf-a.gf||a.t.name.localeCompare(b.t.name)});
}
/* futbolchi statistikasi va intizom */
function discipline(){
  const R=S.rules,per=new Map(),violations=[];
  S.players.forEach(p=>per.set(p.id,{p,g:+p.g0||0,og:0,y:0,r:0,yc:0,ban:0,banned:0,apps:+p.a0||0}));
  const byTeam=new Map();S.players.forEach(p=>{(byTeam.get(p.tid)||byTeam.set(p.tid,[]).get(p.tid)).push(p)});
  const done=S.matches.filter(m=>m.status==='played').sort(chrono);
  for(const m of done){
    const bannedNow=new Set();
    for(const tid of [m.home,m.away])for(const p of byTeam.get(tid)||[]){const d=per.get(p.id);if(d.ban>0){d.ban--;d.banned++;bannedNow.add(p.id)}}
    const played=new Set(m.pl||[]);(m.ev||[]).forEach(e=>played.add(e.p));
    played.forEach(pid=>{const d=per.get(pid);if(d)d.apps++});
    for(const e of m.ev||[]){
      const d=per.get(e.p);if(!d)continue;
      if(bannedNow.has(e.p)&&!violations.some(v=>v.m===m.id&&v.p===e.p))violations.push({m:m.id,p:e.p});
      if(e.t==='g')d.g++;else if(e.t==='og')d.og++;
      else if(e.t==='y'){d.y++;d.yc++;if(R.yellowBan>0&&d.yc%R.yellowBan===0)d.ban++}
      else if(e.t==='r'){d.r++;d.ban+=R.redBan}
    }
  }
  return {per,violations};
}
function roundsInfo(){
  const by=new Map();S.matches.forEach(m=>{(by.get(m.round)||by.set(m.round,[]).get(m.round)).push(m)});
  const total=by.size?Math.max(...by.keys()):0,list=[];
  for(let r=1;r<=total;r++){
    const ms=(by.get(r)||[]).slice().sort(chrono),done=ms.filter(counted).length;
    list.push({r,ms,done,state:ms.length&&done===ms.length?'done':done>0?'part':'todo'});
  }
  const last=list.filter(x=>x.done>0).map(x=>x.r).pop()||0;
  const open=list.find(x=>x.ms.some(m=>m.status==='scheduled'||m.status==='postponed'));
  return {total,list,last,current:open?open.r:(last||1),next:open?open.r:0};
}
function teamNext(tid){return S.matches.filter(m=>(m.status==='scheduled')&&(m.home===tid||m.away===tid)).sort(chrono)[0]||null}
function topScorers(per){
  const rk=new Map(standings().map(r=>[r.id,r.rank])),ix=new Map(S.players.map((p,i)=>[p.id,i]));
  return [...per.values()].filter(d=>d.g>0).sort((a,b)=>b.g-a.g||a.apps-b.apps||(rk.get(a.p.tid)||99)-(rk.get(b.p.tid)||99)||ix.get(a.p.id)-ix.get(b.p.id));
}
function rankWith(list,key){let rk=0,prev=null,i=0;return list.map(x=>{i++;if(x[key]!==prev){rk=i;prev=x[key]}return {x,rk}})}
function checks(){
  const out=[],T=S.teams,P=S.players,M=S.matches;
  const add=(lv,text,link)=>out.push({lv,text,link});
  if(T.length<2)add('bad','Jamoalar soni 2 tadan kam — jadval tuzib bo‘lmaydi.','boshqaruv-jamoalar');
  const nc=T.filter(t=>!(t.coach||'').trim());if(nc.length)add('warn',`${nc.length} ta jamoada murabbiy ko‘rsatilmagan.`,'boshqaruv-jamoalar');
  T.forEach(t=>{const c=P.filter(p=>p.tid===t.id).length;if(c<5)add('warn',`«${t.name}» jamoasida ${c} ta futbolchi bor (kamida 5 ta bo‘lishi kerak).`,'boshqaruv-futbolchilar')});
  const nb=P.filter(p=>!p.birth);if(nb.length)add('warn',`${nb.length} ta futbolchida tug‘ilgan yil yo‘q.`,'boshqaruv-futbolchilar');
  const seen=new Map();P.forEach(p=>{const k=p.name.trim().toLowerCase().replace(/\s+/g,' ');(seen.get(k)||seen.set(k,[]).get(k)).push(p)});
  seen.forEach(a=>{if(a.length>1)add('warn',`«${a[0].name}» ismi ${a.length} marta uchraydi — takrorlanish bo‘lishi mumkin.`,'boshqaruv-futbolchilar')});
  const names=new Map();T.forEach(t=>{const k=t.name.trim().toLowerCase();names.set(k,(names.get(k)||0)+1)});
  names.forEach((n,k)=>{if(n>1)add('bad',`«${k}» nomli jamoa ${n} marta kiritilgan.`,'boshqaruv-jamoalar')});
  const today=todayISO();
  const overdue=M.filter(m=>m.status==='scheduled'&&m.date&&m.date<today);
  if(overdue.length)add('warn',`${overdue.length} ta o‘yin sanasi o‘tib ketgan, lekin natija kiritilmagan.`,'boshqaruv-oyinlar');
  const pp=M.filter(m=>m.status==='postponed');if(pp.length)add('warn',`${pp.length} ta o‘yin kechiktirilgan — yangi sana belgilang.`,'boshqaruv-oyinlar');
  const empt=M.filter(m=>m.status==='played'&&!m.manual&&!(m.ev||[]).length);
  if(empt.length)add('warn',`${empt.length} ta o‘ynalgan o‘yinda gol kiritilmagan (hisob 0:0).`,'boshqaruv-oyinlar');
  const nodate=M.filter(m=>m.status==='scheduled'&&!m.date);
  if(nodate.length)add('warn',`${nodate.length} ta o‘yin uchun sana belgilanmagan.`,'boshqaruv-oyinlar');
  S.penalties.filter(j=>!(j.reason||'').trim()).forEach(()=>add('warn','Sababi ko‘rsatilmagan jarima bor.','boshqaruv-jarimalar'));
  const {violations}=discipline();
  violations.forEach(v=>{const p=IDX.p.get(v.p);add('bad',`«${p?p.name:'?'}» diskvalifikatsiya paytida o‘yinda qatnashgan ko‘rinadi.`,'oyin-'+v.m)});
  if(!out.length)add('ok','Ma’lumotlarda muammo topilmadi.');
  return out;
}

const colorOK=(c)=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#2450d6';
function mono(t){const w=(t.short||'').trim();if(w)return w.slice(0,3).toUpperCase();return (t.name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase()}

function mrow(m,opt){
  opt=opt||{};const H=team(m.home),A=team(m.away),sc=mScore(m);if(!H||!A)return '';
  const hw=sc&&sc[0]>sc[1],aw=sc&&sc[1]>sc[0];
  const mid=sc?`<span class="sc num">${sc[0]}<i>:</i>${sc[1]}</span>`:`<span class="sc pend">${m.status==='postponed'?'—':esc(m.time||'—')}</span>`;
  const bits=[];
  if(!opt.noDate&&m.date)bits.push(fmtD(m.date,true)+(m.time&&sc?', '+esc(m.time):''));
  if(m.venue)bits.push(D(m.venue));
  if(opt.round)bits.push(m.round+'-tur');
  let b='';
  if(m.status==='postponed')b=' <span class="badge">Kechiktirilgan</span>';
  if(m.status==='tech')b=' <span class="badge red">Texnik natija</span>';

function groupByDate(ms,opt){
  let h='',cur=null;
  ms.forEach(m=>{const k=m.date||'';if(cur===null||k!==cur){cur=k;h+=`<div class="mday">${m.date?fmtD(m.date,true,true):'Sanasi belgilanmagan'}</div>`}h+=mrow(m,Object.assign({noDate:true},opt))});

}
function tile(m){
  const H=team(m.home),A=team(m.away),sc=mScore(m);if(!H||!A||!sc)return '';

function stdTable(rows,opt){

   ?`<th class="c-rank">T/r</th><th class="c-team l">Jamoa</th><th title="O‘yinlar">O‘yin</th><th class="hm" title="G‘alaba">G‘</th><th class="hm" title="Durang">D</th><th class="hm" title="Mag‘lubiyat">M</th><th title="Urilgan va o‘tkazib yuborilgan gollar">To‘plar</th><th class="hm" title="Gol farqi">Farq</th><th title="Ochko">Ochko</th><th class="l hm">Shakl</th>`
   :`<th class="c-rank">T/r</th><th class="c-team l">Jamoa</th><th title="O‘yinlar">O‘yin</th><th title="Urilgan va o‘tkazib yuborilgan gollar">To‘plar</th><th title="Ochko">Ochko</th>`;

function vMatch(id){

function vTeam(id){

function mdLite(txt){
  const out=[];let list=null;
  String(txt||'').split(/\n/).forEach(line=>{
    const l=line.trim();if(!l){list=null;return}
    if(l.startsWith('## ')){out.push(`<h3 class="rg">${D(l.slice(3))}</h3>`);list=null;return}
    const m=/^(\d+)[.)]\s+(.*)$/.exec(l);
    if(m){if(!list){list=[];out.push(list)}list.push(m[2]);return}
    list=null;out.push(`<p>${D(l)}</p>`);
  });
  return out.map(x=>Array.isArray(x)?`<ol class="rgl">${x.map(i=>`<li>${D(i)}</li>`).join('')}</ol>`:x).join('');
}

const FD="Oswald,'Arial Narrow','Helvetica Neue',Impact,sans-serif",FNB="Onest,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fitText(c,s,maxW){s=String(s);if(c.measureText(s).width<=maxW)return s;while(s.length>1&&c.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…'}
const IMG={};let repaintFn=null;
function getImg(id){if(!logoOK(id))return null;const src=blobSrc(id);if(!src){wantImages();return null}let e=IMG[id];if(!e){e=IMG[id]={img:new Image(),ok:false};e.img.onload=()=>{e.ok=true;if(repaintFn)repaintFn()};e.img.src=src}return e.ok?e.img:null}
function pCrest(c,t,x,y,r,X){
  const im=getImg(t.logo);
  if(im){c.save();c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.clip();c.fillStyle='#fff';c.fillRect(x-r,y-r,2*r,2*r);const s=Math.max(2*r/im.width,2*r/im.height);c.drawImage(im,x-im.width*s/2,y-im.height*s/2,im.width*s,im.height*s);c.restore();c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=Math.max(2,r*.1);c.beginPath();c.arc(x,y,r-c.lineWidth/2,0,Math.PI*2);c.stroke();return}
  c.fillStyle=colorOK(t.color);c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=Math.max(2,r*.12);c.beginPath();c.arc(x,y,r-c.lineWidth/2,0,Math.PI*2);c.stroke();
  c.fillStyle='#fff';c.font='600 '+Math.round(r*.7)+'px '+FD;c.textAlign='center';c.textBaseline='middle';c.fillText(X.d(mono(t)),x,y+1);
}
function socialLine(){return socialLinks().map(([k,l])=>l+': '+S.meta[k].replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,'')).join('   ')}

function posterCaption(kind,round,X,noLink){
  const st=standings(),lines=[];
  const title=X.d(S.meta.name)+' '+X.d(S.meta.season);
  if(kind==='table'){
    lines.push(title,X.t('Turnir jadvali')+':','');
    st.forEach(r=>lines.push(r.rank+'. '+X.d(r.t.name)+' — '+r.pts+' '+X.t('ochko')+' ('+r.p+' '+X.t('o‘yin')+', '+r.gf+'–'+r.ga+')'));
  }else if(kind==='scorers'){
    const {per}=discipline(),ts=topScorers(per).slice(0,10);
    lines.push(title,X.t('To‘purarlar')+':','');
    ts.forEach((x,i)=>{const t=team(x.p.tid);lines.push((i+1)+'. '+X.d(x.p.name)+(t?' ('+X.d(t.name)+')':'')+' — '+x.g+' '+X.t('gol'))});
  }else if(kind==='results'){
    const r=ri_(round);lines.push(title,round+X.t('-tur natijalari')+':','');
    r.forEach(m=>{const H=team(m.home),A=team(m.away),sc=mScore(m);lines.push(X.d(H.name)+(sc?' '+sc[0]+':'+sc[1]+' ':' — ')+X.d(A.name))});
  }else{
    lines.push(title,X.t('Tur taqvimi')+':','');

  return lines.join('\n').trim();
}
function ri_(r){const x=roundsInfo().list[r-1];return x?x.ms:[]}
function drawPoster(cv,kind,round,X){
  const c=cv.getContext('2d'),W=1080,H=1350,PAD=56;
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1017');g.addColorStop(1,'#0f1f1b');c.fillStyle=g;c.fillRect(0,0,W,H);

function pTable(c,X,x,y,w,h){
  const rows=standings(),n=Math.max(rows.length,1),hh=54,rh=Math.min(92,(h-hh-60)/n);

function pCalendar(c,X,x,y,w,h){

function loadImgFile(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
async function makeBlob(file,o){
  const im=await loadImgFile(file),cv=document.createElement('canvas'),c=cv.getContext('2d');
  if(o.square){const s=Math.min(im.width,im.height);cv.width=cv.height=o.max;c.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,o.max,o.max)}
  else{const k=Math.min(1,o.max/Math.max(im.width,im.height));cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);c.drawImage(im,0,0,cv.width,cv.height)}
  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),o.mime,o.q));
}
async function uploadImage(file,o){
  if(!FB.ok||!FB.user){toast('Rasm yuklash uchun avval tizimga kiring.');return null}
  if(!file||!/^image\//.test(file.type)){toast('Rasm faylini tanlang (PNG, JPG yoki WebP).');return null}
  try{
    const b=await makeBlob(file,o);
    const data=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
    if(data.length>900000){toast('Rasm hajmi juda katta. Kichikroq rasm tanlang.');return null}
    const id=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
    await FB.db.doc('images/'+id).set({d:data});
    IMGC[id]=data;return id;
  }catch(e){toast(e&&e.code==='permission-denied'?'Sizda rasm yuklash huquqi yo‘q.':'Rasmni yuklab bo‘lmadi. Boshqa rasm bilan urinib ko‘ring.');return null}
}

function roundRobin(ids,dbl){
  const arr=ids.slice();if(arr.length%2)arr.push(null);
  const n=arr.length,rounds=[];
  for(let r=0;r<n-1;r++){const ms=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b)ms.push(r%2?[b,a]:[a,b])}rounds.push(ms);arr.splice(1,0,arr.pop())}
  return dbl?rounds.concat(rounds.map(ms=>ms.map(([a,b])=>[b,a]))):rounds;
}

  const d=JSON.parse(JSON.stringify(S));
  x.meta=Object.assign({platform:'',translit:true},d.meta,x.meta||{});x.rules=Object.assign({},d.rules,x.rules||{});

async function reconcile(id){
  const m=IDX.m.get(id),goals=new Map(),pl=new Set(m.pl||[]);
  (m.ev||[]).forEach(e=>{pl.add(e.p);if(e.t==='g')goals.set(e.p,(goals.get(e.p)||0)+1)});
  const hit=[...pl].map(x=>IDX.p.get(x)).filter(p=>p&&((+p.g0||0)>0||(+p.a0||0)>0));
  if(!hit.length)return;
  const ok=await ask('Gollar ikki marta hisoblanmasin','Bu o‘yin avval faqat hisob bilan kiritilgan edi. Quyidagi futbolchilarda «avvalgi gollar» yoki «avvalgi o‘yinlar» bor: '+hit.map(p=>p.name).join(', ')+'. Agar bu o‘yin ularning ichida hisoblangan bo‘lsa, shu o‘yindagi gol va o‘yin soni ulardan ayriladi. Ayiraylikmi?','Ha, ayirish');
  if(ok)mutate(()=>{hit.forEach(p=>{p.g0=Math.max(0,(+p.g0||0)-(goals.get(p.id)||0));p.a0=Math.max(0,(+p.a0||0)-(p.a0>0&&pl.has(p.id)?1:0))})});
}

let rt=0;const schedRender=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!ED)render(true)},60)};

function wantImages(){

  const ids=[...S.teams.map(t=>t.logo),S.meta.banner,isAdmin?S.meta.posterBg:''].filter(logoOK);
  ids.forEach(id=>{

    let c=null;try{c=localStorage.getItem('img:'+id)}catch(e){}

    for(const [id,data] of Object.entries(S.inline||{}))await FB.db.doc('images/'+id).set({d:data});
    FB.rev=0;dirty++;await doSave();
  }catch(e){toast(e&&e.code==='permission-denied'?'Sizda ruxsat yo‘q: Firestore qoidalarida emailingiz ko‘rsatilganini tekshiring.':'Yuklab bo‘lmadi. Qayta urinib ko‘ring.')}
};
async function doSave(){
  if(!FB.ok||!FB.user)return toast('Saqlash uchun avval tizimga kiring.');
  publishing=true;render(true);
  try{
    S.meta.updated=new Date().toISOString();
    const st=JSON.parse(JSON.stringify(S));delete st.inline;
    const ref=FB.db.doc('league/main');
    const newRev=await FB.db.runTransaction(async(tx)=>{
      const s=await tx.get(ref),remote=s.exists?(s.data().rev||0):0;
      if(remote!==FB.rev)throw {code:'conflict'};
      tx.set(ref,{state:JSON.stringify(st),rev:remote+1,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:FB.user.email||''});
      return remote+1;
    });
    FB.rev=newRev;dirty=0;FB.stale=false;publishing=false;toast('Saqlandi. Sayt yangilandi.');render(true);
  }catch(e){
    publishing=false;const c=e&&e.code;
    toast(c==='conflict'?'Boshqa tashkilotchi ma’lumotni o‘zgartirgan. Sahifani yangilab, o‘zgarishingizni qayta kiriting.':c==='permission-denied'?'Sizda saqlash huquqi yo‘q: Firestore qoidalarida emailingiz ko‘rsatilganini tekshiring.':'Saqlab bo‘lmadi. Internetni tekshirib, qayta urinib ko‘ring.');
    render(true);
  }
}
window.addEventListener('beforeunload',(e)=>{if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('hashchange',()=>{if(dlg.open&&dlgCfg&&dlgCfg.closeOnNav)dlg.close();render();window.scrollTo(0,0)});
/* ---------- Boshlash ---------- */
render();
initFirebase();
wantImages();

})();</script>
